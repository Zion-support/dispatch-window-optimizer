<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Dispatch Window Optimizer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🗓️ Dispatch Window Optimizer</h1><p>Optimize your service windows.</p><label>Jobs/week: <input id="j" type="number" value="60"></label> <label>Techs: <input id="t" type="number" value="8"></label> <label>Window length (h): <input id="w" type="number" value="4"></label> <button onclick="go()">Optimize</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const cap=g('t')*40/g('w'),util=Math.round(g('j')/cap*100);document.getElementById('out').textContent=`Weekly capacity: ${Math.round(cap)} windows\nUtilization: ${util}% ${util>90?'🔴 over capacity — add windows or techs':util>70?'🟢 optimal':'🟡 underutilized — tighten windows'}\nRecommended window: ${util>90?'2h':util>70?'4h':'6h'} slots\n\nAI dispatch with skills/geo matching: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/dispatch-window-optimizer">GitHub</a> · <a href="https://ziontechgroup.com/field-tech-scheduler/">Field Tech Scheduler</a></p></body></html>
